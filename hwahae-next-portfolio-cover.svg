<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1800" viewBox="0 0 1440 1800">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eaf6ff" stop-opacity="0.34"/>
      <stop offset="0.42" stop-color="#eaf6ff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#f7e8e2" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#061c52" flood-opacity="0.14"/>
    </filter>
  </defs>

  <image x="0" y="0" width="1440" height="1800" xlink:href="assets/hwahae-next-cover-background.png" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1440" height="1800" fill="url(#wash)"/>

  <g fill="#061d58">
    <text x="92" y="98" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="8">HWAHAE NEXT</text>
    <line x1="92" y1="128" x2="424" y2="128" stroke="#061d58" stroke-width="2" opacity="0.72"/>
    <text x="92" y="164" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="0.3">HWAHAE NEXT — redesign concept</text>
    <text x="92" y="194" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" letter-spacing="1.4">RESEARCH · UX/UI DESIGN · 2026</text>

    <text x="87" y="325" font-family="Arial Narrow, Helvetica Neue Condensed, Arial, sans-serif" font-size="126" font-weight="800" letter-spacing="-7">HWAHAE</text>
    <text x="87" y="440" font-family="Arial Narrow, Helvetica Neue Condensed, Arial, sans-serif" font-size="126" font-weight="800" letter-spacing="-7">NEXT</text>
    <rect x="91" y="476" width="58" height="9" rx="4.5" fill="#dfff25"/>
    <text x="171" y="486" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="0.3">redesign concept</text>

    <text x="93" y="558" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" letter-spacing="0.1">Beauty intelligence, made personal.</text>
    <text x="93" y="591" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" letter-spacing="0.1">Your skin, in focus.</text>
  </g>

  <g transform="translate(92 1420)" filter="url(#shadow)">
    <rect width="536" height="244" rx="18" fill="#f6fbff" fill-opacity="0.86" stroke="#ffffff" stroke-opacity="0.92" stroke-width="2"/>
    <text x="34" y="52" fill="#061d58" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.7">PROJECT SYSTEM</text>
    <line x1="34" y1="74" x2="501" y2="74" stroke="#061d58" stroke-opacity="0.18"/>
    <text x="34" y="115" fill="#061d58" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Project HWAHAE × LEXEM</text>
    <text x="34" y="154" fill="#061d58" font-family="Arial, Helvetica, sans-serif" font-size="16">Personalization engine</text>
    <text x="209" y="154" fill="#061d58" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">LEXEM Insight</text>
    <text x="34" y="197" fill="#061d58" font-family="Arial, Helvetica, sans-serif" font-size="16">Conversational assistant</text>
    <text x="244" y="197" fill="#061d58" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Remi / 레미</text>
