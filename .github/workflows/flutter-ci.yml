name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Flutter 3.47.0
        run: |
          git clone --depth 1 --branch 3.47.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Verify Flutter toolchain
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Flutter Web
        run: flutter build web --release

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload Android APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pharma-beauty-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Flutter Web build
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pharma-beauty-web
          path: build/web
          if-no-files-found: error
          retention-days: 14
